services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    image: rag_service_app:latest
    container_name: rag_service_app
    ports:
      - "127.0.0.1:8000:8000"

    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL} 
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST}
    volumes:
      - ./app:/app/app
      - ./models:/app/models
      - ./docs:/app/docs
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - /etc/ssl/private/api-key.pem:/app/certs/api-key.pem:ro
      - /etc/ssl/certs/api-cert.pem:/app/certs/api-cert.pem:ro

    command:
      - sh
      - -c
      - >
          alembic upgrade head &&
          exec gunicorn app.main:app
          --worker-class uvicorn.workers.UvicornWorker
          --workers 1
          --bind 0.0.0.0:8000
          --worker-connections 500
          --timeout 30
          --keep-alive 2
          --log-level info
          --access-logfile -

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy

    env_file:
      - .env
    restart: unless-stopped
    networks:
      - rag_network
    deploy: # 🔴 VPS is cpu only
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # MySQL Database
  mysql:
    image: mysql:8.0.39 #🔴 hardcoded !
    # image: mysql:5.7.42 #🔴 hardcoded !
    container_name: rag_service_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306" #🔴 hardcoded !
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD || exit 1"]
      timeout: 20s
      retries: 10
    # network_mode: "host"
    networks:
      - rag_network

  # Redis Cache
  redis:
    image: valkey/valkey:8 #🔴 hardcoded !
    container_name: rag_service_redis
    ports:
      - "6379:6379" #🔴 hardcoded !
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    # network_mode: "host"
    networks:
      - rag_network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.3 #🔴 hardcoded !
    # image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0 #🔴 hardcoded !
    container_name: rag_service_elasticsearch
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-ragflow_test}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ports:
      - "9200:9200" #🔴 hardcoded !
      - "9300:9300" #🔴 hardcoded !
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:${ELASTICSEARCH_PASSWORD:-ragflow_test} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    # network_mode: "host"  
    networks:
      - rag_network

volumes:
  mysql_data: 
  redis_data: 
  elasticsearch_data: 

networks:
  rag_network:
    driver: bridge