[pytest]
# Pytest configuration for RAG Service tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode - use 'auto' for pytest-asyncio 0.21.x
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (require database/redis)
    security: Security-focused tests
    slow: Slow running tests
    asyncio: Async tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Timeout for each test (seconds)
timeout = 30

# Ignore deprecation warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning