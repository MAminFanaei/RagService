[project]
name = "rag-service-claude"
version = "0.1.0"
description = ""
authors = [
    {name = "amin",email = "mohammadaminfanaie@gmail.com"}
]
readme = "README.md"
requires-python = "^3.10"

# RUN poetry install --only main
dependencies = [
    # ── Web Framework & Server ──────────────────────────────
    "fastapi==0.120.1",
    "uvicorn==0.38.0",
    "gunicorn==23.0.0",
    "uvloop==0.22.1",
    "httptools==0.7.1",

    # ── Data Validation & Settings ──────────────────────────
    "pydantic[email]==2.12.3",
    "pydantic-settings==2.11.0",
    "email-validator==2.3.0",

    # ── Database & Migrations ───────────────────────────────
    "sqlalchemy==2.0.44",
    "alembic==1.12.1",
    "pymysql==1.1.0",
    "asyncmy==0.2.11",

    # ── Cache ───────────────────────────────────────────────
    "aioredis==2.0.1",
    "redis==5.0.1",

    # ── Auth & Security ─────────────────────────────────────
    "python-jose==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "argon2-cffi==25.1.0",
    "authlib==1.2.0",

    # ── Observability ───────────────────────────────────────
    "structlog==23.2.0",
    "prometheus-client==0.24.1",

    # ── Rate Limiting ───────────────────────────────────────
    "slowapi==0.1.9",

    # ── HTTP Client ─────────────────────────────────────────
    "httpx==0.28.1",

    # ── AI / ML ─────────────────────────────────────────────
    "langchain==0.3.27",
    "openai (==2.33.0)",
    "langchain-core==0.3.79",
    "langchain-community==0.3.29",
    "langchain-elasticsearch==0.3.2",
    "langchain-huggingface==0.3.1",
    "langgraph==0.6.5",
    "sentence-transformers==5.0.0",
    "torch==2.7.1",
    ]

# RUN poetry install --with test
# ── Test dependencies ───────────────────────────────────────
[tool.poetry.group.test.dependencies]
pytest = ">=8.3.3,<10.0.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=7.0.0,<8.0.0"
pytest-xdist = ">=3.8.0,<4.0.0"
pytest-mock = ">=3.15.1,<4.0.0"
pytest-timeout = ">=2.4.0,<3.0.0"
hypothesis = ">=6.151.4,<7.0.0"
faker = "==20.1.0"
aiosqlite = ">=0.19.0"
coverage = ">=7.3.0"
locust = ">=2.43.1,<3.0.0"

# RUN poetry install --with dev
# ── Dev dependencies ────────────────────────────────────────
[tool.poetry.group.dev.dependencies]
ruff = ">=0.14.14,<0.15.0"
mypy = ">=1.19.1,<2.0.0"
bandit = ">=1.9.3,<2.0.0"
safety = ">=3.7.0,<4.0.0"
pip-audit = ">=2.10.0,<3.0.0"
pipdeptree = "==2.30.0"
rich = ">=14.3.2,<15.0.0"
watchfiles = "==1.1.1"